spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${DB_USERNAME:payment}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # db/migration/postgresql эсвэл db/migration/oracle-ийг DB-ээс хамаарч автоматаар сонгоно.
    locations: classpath:db/migration/{vendor}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8090}
  forward-headers-strategy: framework

payment:
  # Provider-ууд callback илгээх гаднаас хандах хаяг (жишээ нь https://pay.example.mn)
  public-base-url: ${PAYMENT_PUBLIC_BASE_URL}
  # /admin/** API-ийн түлхүүр
  admin-api-key: ${PAYMENT_ADMIN_API_KEY}
  # AES-256 түлхүүр, base64 (openssl rand -base64 32)
  encryption-key: ${PAYMENT_ENCRYPTION_KEY}
  invoice-ttl: ${PAYMENT_INVOICE_TTL:PT24H}
  sandbox-enabled: ${PAYMENT_SANDBOX_ENABLED:false}
  # Олон instance-тай бол зөвхөн нэг дээр нь true
  scheduling-enabled: ${PAYMENT_SCHEDULING_ENABLED:true}
  http:
    connect-timeout: PT10S
    read-timeout: PT30S

ebarimt:
  info-api-url: ${EBARIMT_INFO_API_URL:https://api.ebarimt.mn}
  send-cron: ${EBARIMT_SEND_CRON:0 0 23 * * *}
  easy-register:
    auth-url: ${EBARIMT_EASY_AUTH_URL:}
    api-url: ${EBARIMT_EASY_API_URL:}
    client-id: ${EBARIMT_EASY_CLIENT_ID:}
    username: ${EBARIMT_EASY_USERNAME:}
    password: ${EBARIMT_EASY_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
